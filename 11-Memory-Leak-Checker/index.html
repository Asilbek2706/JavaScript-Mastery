<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Memory Leak Checker</title>
  <link rel="stylesheet" href="style.css"> </head>
<body>
<div class="container">
  <h2>Memory Leak Lab</h2>
  <p>Xotira holati: <span id="memory-status">Barqaror</span></p>

  <div class="controls">
    <button id="leak-btn" class="danger">Xotirani to'ldirish (Leak)</button>
    <button id="clean-btn" class="success">Tozalash (Fix)</button>
  </div>

  <div class="monitor">
    <div id="visual-memory" class="bar"></div>
  </div>
  <ul id="log-list"></ul>
</div>
<script src="script.js"></script>
</body>
</html>
